<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>Calculadora de Média Facens · 6 matérias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="calculadora-media-facens.css?v=5">
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar.
      (() => {
        let tema = null;
        try { tema = localStorage.getItem("calc-tema"); } catch {}
        if (tema !== "light" && tema !== "dark") {
          tema = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = tema;
      })();
    </script>
  </head>

  <body>
    <main class="wrap">
      <header class="top">
        <img class="brand" src="facens-logo.png" alt="Facens">

        <div class="intro">
          <h1>Calculadora de média</h1>
          <p class="sub">
            Dê um nome para cada matéria e informe AC1, AC2, AG e AF.
            Deixe a AF em branco para ver quanto precisa tirar nela.
          </p>
        </div>

        <div class="toolbar">
          <label class="meta" for="meta">
            <span>Média mínima</span>
            <input
              type="text"
              inputmode="decimal"
              id="meta"
              value="6,0"
              autocomplete="off"
            >
          </label>
          <button type="button" id="clear">Limpar notas</button>
          <button
            type="button"
            id="theme"
            class="theme"
            aria-label="Alternar tema claro/escuro"
            title="Alternar tema claro/escuro"
          >
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
            </svg>
          </button>
        </div>
      </header>

      <section
        class="subjects"
        id="subjects"
        aria-label="Matérias"
      ></section>

      <footer class="note">
        Pesos: AC1 15% · AC2 30% · AG 10% · AF 45%. A média mínima padrão é
        6,0; confira o Plano de Ensino da disciplina. As notas ficam salvas
        só neste navegador.
      </footer>
    </main>

    <script src="calculadora-media-facens.js?v=5" defer></script>
  </body>
</html>
