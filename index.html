<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de Média Facens · 6 matérias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="calculadora-media-facens.css">
  </head>

  <body>
    <main class="wrap">
      <header>
        <img class="brand" src="facens-logo.png" alt="Facens">
        <h1>Calculadora de Média</h1>
        <p class="sub">
          Acompanhe até seis matérias. Dê um nome para cada uma e informe as
          notas de AC1, AC2, AG e AF.
        </p>
      </header>

      <section
        class="subjects"
        id="subjects"
        aria-label="Matérias"
      ></section>

      <section class="panel">
        <div class="settings">
          <label for="meta">
            Média mínima para aprovação
            <input
              type="text"
              inputmode="decimal"
              id="meta"
              value="6,0"
              autocomplete="off"
            >
          </label>
          <button type="button" id="clear">Limpar notas</button>
        </div>

        <p class="note">
          Pesos usados: AC1 15%, AC2 30%, AG 10% e AF 45%. Deixe a AF em
          branco para ver quanto precisa tirar nela. A média mínima padrão é
          6,0; confira o Plano de Ensino da disciplina.
        </p>
      </section>
    </main>

    <script src="calculadora-media-facens.js" defer></script>
  </body>
</html>
