<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>Calculadora de Média Facens · 6 matérias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="calculadora-media-facens.css">
  </head>

  <body>
    <main class="wrap">
      <header class="top">
        <img class="brand" src="facens-logo.png" alt="Facens">

        <div class="intro">
          <h1>Calculadora de média</h1>
          <p class="sub">
            Dê um nome para cada matéria e informe AC1, AC2, AG e AF.
            Deixe a AF em branco para ver quanto precisa tirar nela.
          </p>
        </div>

        <div class="toolbar">
          <label class="meta" for="meta">
            <span>Média mínima</span>
            <input
              type="text"
              inputmode="decimal"
              id="meta"
              value="6,0"
              autocomplete="off"
            >
          </label>
          <button type="button" id="clear">Limpar notas</button>
        </div>
      </header>

      <section
        class="subjects"
        id="subjects"
        aria-label="Matérias"
      ></section>

      <footer class="note">
        Pesos: AC1 15% · AC2 30% · AG 10% · AF 45%. A média mínima padrão é
        6,0; confira o Plano de Ensino da disciplina. As notas ficam salvas
        só neste navegador.
      </footer>
    </main>

    <script src="calculadora-media-facens.js" defer></script>
  </body>
</html>
